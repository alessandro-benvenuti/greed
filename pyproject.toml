[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greed-vascular-ged"
version = "0.1.0"
description = "Reproducible 3D vascular graph GED labelling and GREED training"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6.0"]

[project.optional-dependencies]
train = ["torch>=2.2", "torch-geometric>=2.5", "scipy>=1.10"]
test = ["pytest>=8"]

[project.scripts]
vascular-ged = "vascular_ged.cli:main"

[tool.setuptools.packages.find]
include = ["vascular_ged*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
